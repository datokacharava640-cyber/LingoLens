name: Build LingoLens APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config lld
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "cython<3.0.0"
        python -m pip install --upgrade buildozer

    - name: Setup python-for-android directly
      run: |
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        rm -rf python-for-android
        git clone --depth 1 https://github.com/kivy/python-for-android.git python-for-android

    - name: Build Android Debug APK
      env:
        ANDROID_NDK_HOME: ''
        ANDROID_NDK_ROOT: ''
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-UltraPro-Debug-APK
        path: bin/*.apk
        if-no-files-found: error
