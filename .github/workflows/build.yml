name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v36-${{ hashFiles('buildozer.spec') }}-${{ runner.os }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libsqlite3-dev libssl-dev libffi-dev liblzma-dev

      - name: Install Buildozer, Cython & P4A
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.36" "buildozer==1.5.0" "python-for-android==2024.1.21"

      - name: Complete Clean Build Cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Build APK with Buildozer
        env:
          CFLAGS: "-w"
          CXXFLAGS: "-w"
          P4A_PYTHON_VERSION: "3.9"
          PYTHONPATH: "/opt/hostedtoolcache/Python/3.9.25/x64/lib/python3.9"
        run: |
          export PATH="/opt/hostedtoolcache/Python/3.9.25/x64/bin:$PATH"
          export PYTHON_BIN="/opt/hostedtoolcache/Python/3.9.25/x64/bin/python3"
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-APK
          path: bin/*.apk
