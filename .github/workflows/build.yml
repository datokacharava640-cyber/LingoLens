name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          pkg-config \
          autoconf \
          automake \
          libtool \
          ccache \
          libffi-dev \
          libssl-dev \
          python3-dev \
          zip \
          unzip \
          openjdk-17-jdk \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libsqlite3-dev \
          sqlite3 \
          libbz2-dev \
          gettext

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "cython==0.29.33"
        python -m pip install buildozer

    - name: Clean Previous Builds & Patch Spec
      run: |
        buildozer android clean || true
        sed -i 's/^#\? \?android.api =.*/android.api = 31/' buildozer.spec || true
        sed -i 's/^#\? \?android.minapi =.*/android.minapi = 21/' buildozer.spec || true
        sed -i 's/^#\? \?android.ndk =.*/android.ndk = 23b/' buildozer.spec || true

    - name: Build APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
