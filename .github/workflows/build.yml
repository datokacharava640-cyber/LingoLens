name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk unzip zip autoconf \
            automake libtool sqlite3 libsqlite3-dev libffi-dev libssl-dev pkg-config cmake ninja-build
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" buildozer

      - name: Build APK with System NDK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653
          APP_ANDROID_NDK_PATH: /usr/local/lib/android/sdk/ndk/25.2.9519653
          APP_ANDROID_SDK_PATH: /usr/local/lib/android/sdk
        run: |
          buildozer android release || buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-APK
          path: bin/*.apk
