name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        apt-get update
        apt-get install -y \
          sudo \
          git \
          python3 \
          python3-pip \
          python3-setuptools \
          build-essential \
          ffmpeg \
          pkg-config \
          autoconf \
          automake \
          libtool \
          ccache \
          libffi-dev \
          libssl-dev \
          zip \
          unzip \
          openjdk-17-jdk \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libsqlite3-dev \
          sqlite3 \
          libbz2-dev \
          gettext \
          curl

    - name: Configure Git Safe Directory
      run: |
        git config --global --add safe.directory '*'

    - name: Install Build Tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install "cython==0.29.36"
        python3 -m pip install "buildozer==1.5.0"
        python3 -m pip install "python-for-android==2024.1.21"

    - name: Accept Android SDK Licenses Preemptively
      run: |
        mkdir -p /root/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n24333f8a637b8244d67381122f3e3e0a65b6bfbd" > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo -e "\nd9764521770c91b20107658c340a968a44450112" > /root/.buildozer/android/platform/android-sdk/licenses/intel-android-sysimage-license

    - name: Clean Build Cache
      run: |
        rm -rf .buildozer

    - name: Build APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
        CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=enum-conversion -Wno-error=format-security"
        CXXFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=enum-conversion -Wno-error=format-security"
      run: |
        buildozer --allow-root android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
