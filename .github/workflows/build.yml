name: Build LingoLens Ultra Pro APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libunwind-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl \
            libffi-dev libgdbm-dev libncurses5-dev libncursesw5-dev \
            libreadline-dev autoconf automake libtool pkg-config zip unzip \
            openjdk-17-jdk ccache lld cmake

      - name: Install Compatible Cython & Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython buildozer

      - name: Build APK with Buildozer
        env:
          APP_ACCEPT_SDK_LICENSES: '1'
        run: |
          buildozer android clean
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-Ultra-Pro-debug
          path: bin/*.apk
          retention-days: 7
