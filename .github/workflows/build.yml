name: Build LingoLens Encrypted AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "cython==0.29.36"
        python -m pip install "buildozer==1.5.0"

    - name: Clean Cache Completely
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer

    - name: Build Android AAB
      run: |
        buildozer -v android release
      env:
        CYTHON: cython

    - name: Upload Encrypted AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-UltraPro-Encrypted-Release
        path: bin/*.aab
