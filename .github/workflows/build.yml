name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          pkg-config \
          autoconf \
          automake \
          libtool \
          ccache \
          libffi-dev \
          libssl-dev \
          zip \
          unzip \
          openjdk-17-jdk \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libsqlite3-dev \
          sqlite3 \
          libbz2-dev \
          gettext \
          curl

    - name: Set Python 3.10 Priority in PATH
      run: |
        echo "$pythonLocation/bin" >> $GITHUB_PATH
        echo "PYTHON=$pythonLocation/bin/python3" >> $GITHUB_ENV

    - name: Install Build Tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install "cython==0.29.36"
        python3 -m pip install "buildozer==1.5.0"
        python3 -m pip install "python-for-android==2024.1.21"

    - name: Setup Android Command-Line Tools & Accept Licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        curl -sS -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q cmdline-tools.zip
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/ || true
        ln -sf ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # Accept all SDK licenses automatically
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Clean Build Cache
      run: |
        rm -rf .buildozer

    - name: Build APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
        CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=enum-conversion -Wno-error=format-security"
        CXXFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=enum-conversion -Wno-error=format-security"
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
