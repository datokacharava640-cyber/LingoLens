name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Free Disk Space & Setup Swap
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile
        sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=4096
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git ffmpeg libsqlite3-dev zlib1g-dev openjdk-17-jdk zip unzip autoconf libtool cmake lld perl pkg-config libncurses5-dev libncursesw5-dev

    - name: Install Pinned Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install "cython==0.29.36" "buildozer==1.5.0"

    - name: Build Clean APK
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-debug-apk
        path: bin/*.apk
      if: success()
