name: Build LingoLens Ultra Pro Standard APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk unzip zip ccache
        pip install "setuptools<69.0.0" "wheel<0.42.0"
        pip install "cython==0.29.33" "buildozer==1.5.0"

    - name: Clean buildozer directory
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer

    - name: Build APK with Buildozer
      run: |
        export PIP_RETRIES=10
        export PIP_TIMEOUT=60
        export PIP_BUILD_ISOLATION=0
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Ultra-Pro-APK
        path: bin/*.apk
