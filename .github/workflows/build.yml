name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Force python3 to use Python 3.10 safely
        run: |
          mkdir -p $HOME/bin
          ln -s $(which python) $HOME/bin/python3
          ln -s $(which python) $HOME/bin/python
          echo "$HOME/bin" >> $GITHUB_PATH
          python3 --version

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev \
            libssl-dev libffi-dev liblzma-dev

      - name: Install Buildozer & Cython
        run: |
          python3 -m pip install --upgrade pip
          pip install "Cython==0.29.21" "buildozer==1.4.0"

      - name: Build APK with Buildozer
        env:
          CFLAGS: "-w"
          CXXFLAGS: "-w"
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-APK
          path: bin/*.apk
