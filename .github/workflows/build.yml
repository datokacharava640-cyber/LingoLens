name: Build LingoLens APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential ccache git unzip zip autoconf libtool pkg-config \
          libffi-dev libssl-dev libsqlite3-dev zlib1g-dev libjpeg-dev libpng-dev \
          lld clang cmake ninja-build
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUMS: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Ultra-Pro-APK
        path: bin/*.apk
