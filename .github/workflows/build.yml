name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libtool pkg-config python3-dev libsqlite3-dev zlib1g-dev unzip zip autoconf automake cmake lld clang libncurses5-dev libncursesw5-dev
        python -m pip install --upgrade pip setuptools wheel
        
        # დავაყენოთ buildozer და p4a-ს უახლესი ვერსია, რომელსაც Cython 3-ის სრული მხარდაჭერა აქვს
        pip install cython buildozer
        pip install git+https://github.com/kivy/python-for-android.git@master

    - name: Clean build cache
      run: |
        rm -rf ~/.buildozer .buildozer bin/

    - name: Build APK with Buildozer
      run: |
        # NDK Clang-ს ვაიძულებთ აპატიოს C ტიპების შეცდომები
        export CFLAGS="-w -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -std=gnu99"
        export CXXFLAGS="-w -std=gnu++11"
        export LDFLAGS="-w"
        
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
