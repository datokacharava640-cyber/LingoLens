name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ccache libffi-dev libssl-dev \
            libltdl-dev python3-setuptools libsqlite3-dev zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake ant ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev
          python -m pip install --upgrade pip
          pip install "setuptools==65.5.0" "wheel==0.38.4" "cython==0.29.33" "buildozer==1.5.0"

      - name: Clean Buildozer Cache
        run: rm -rf .buildozer

      - name: Build APK with Buildozer
        env:
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: |
          buildozer --warn-on-root -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-APK
          path: bin/*.apk
