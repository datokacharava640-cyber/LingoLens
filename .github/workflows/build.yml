name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config

      - name: Install Python Packages in Python 3.10
        run: |
          python3.10 -m pip install --upgrade pip setuptools
          python3.10 -m pip install "Cython<3.0.0" buildozer==1.5.0

      - name: Build Android APK with Buildozer
        run: |
          python3.10 -m buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
