name: Build LingoLens APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev ffmpeg libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev \
            libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk \
            ccache zip unzip git libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools
          python -m pip uninstall -y cython
          python -m pip install "cython==0.29.33" "buildozer==1.5.0"

      # V2 ქეში - ძველი გაფუჭებული Cython 3.x ქეშის დასაიგნორებლად
      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Cache Buildozer Target Directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-target-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK with Buildozer
        env:
          APP_CYTHON_VERSION: "0.29.33"
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-Pro-APK
          path: bin/*.apk
