name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libffi-dev libssl-dev ccache git ffmpeg \
          libsqlite3-dev zlib1g-dev zip unzip autoconf libtool cmake lld \
          perl pkg-config gettext autopoint openjdk-17-jdk libjpeg-dev \
          libncurses5-dev libncursesw5-dev libtinfo5

    - name: Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install "cython<3.0.0" "buildozer>=1.5.0"

    - name: Build Clean APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-debug-apk
        path: bin/*.apk
