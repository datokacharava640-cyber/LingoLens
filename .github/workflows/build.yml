name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Patch buildozer.spec
      run: |
        sed -i 's/^#\? \?android.api =.*/android.api = 31/' buildozer.spec || true
        sed -i 's/^#\? \?android.minapi =.*/android.minapi = 21/' buildozer.spec || true
        sed -i 's/^#\? \?android.ndk =.*/android.ndk = 23b/' buildozer.spec || true

    - name: Build APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
