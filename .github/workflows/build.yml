name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg pkg-config autoconf automake libtool ccache \
          libffi-dev libssl-dev zip unzip openjdk-17-jdk libsdl2-dev \
          libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev \
          libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev \
          sqlite3 libbz2-dev gettext curl

    - name: Install Build Tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install "cython<3.0.0"
        python3 -m pip install "buildozer==1.5.0"

    - name: Clean Cache
      run: |
        rm -rf .buildozer

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
