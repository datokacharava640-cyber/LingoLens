name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure Git Safe Directory
      run: |
        git config --global --add safe.directory '*'

    - name: Accept Android SDK Licenses Preemptively
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        mkdir -p /github/home/.buildozer/android/platform/android-sdk/licenses
        
        LICENSE_BODY=$'\n24333f8a637b8244d67381122f3e3e0a65b6bfbd\n84831b9409646a918e30573bab4c9c91346d8abd\nd9764521770c91b20107658c340a968a44450112'
        
        echo "$LICENSE_BODY" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "$LICENSE_BODY" > /github/home/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Clean Build Cache
      run: |
        rm -rf .buildozer

    - name: Build APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
        CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=enum-conversion -Wno-error=format-security"
        CXXFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=enum-conversion -Wno-error=format-security"
      run: |
        buildozer --allow-root android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
