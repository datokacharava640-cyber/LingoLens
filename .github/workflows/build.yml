name: Build LingoLens APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config lld
        python -m pip install --upgrade pip
        python -m pip install "setuptools<60.0.0" wheel "cython==0.29.33"
        python -m pip install buildozer

    - name: Clean Cache
      run: |
        rm -rf .buildozer/

    - name: Build Android Debug APK
      env:
        ANDROID_NDK_HOME: ''
        ANDROID_NDK_ROOT: ''
        USE_CYTHON3: '0'
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-UltraPro-Debug-APK
        path: |
          bin/*.apk
          **/bin/*.apk
        if-no-files-found: error
