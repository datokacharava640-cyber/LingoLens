name: Build LingoLens Encrypted AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies & Legacy Cython
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" buildozer kivy

    - name: Build Android AAB with Buildozer
      run: |
        buildozer -v android release

    - name: Upload Encrypted AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-UltraPro-Encrypted-Release
        path: bin/*.aab
