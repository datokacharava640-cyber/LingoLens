name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev \
            libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk unzip zip \
            autoconf automake libtool pkg-config gettext gfortran libltdl-dev

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools
          python3 -m pip install "Cython<3.0.0" buildozer

      - name: Build APK with Buildozer
        env:
          P4A_PYTHON_VERSION: "3.10"
        run: |
          rm -rf .buildozer bin .plat-android
          # ვკლონირებთ სტაბილურ p4a-ს, სადაც Python 3.10 მუშაობს
          mkdir -p .buildozer/android/platform
          git clone -b v2023.09.22 --single-branch https://github.com/kivy/python-for-android.git .buildozer/android/platform/python-for-android
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-APK
          path: bin/*.apk
