name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure buildozer.spec for Python 3.11
      run: |
        sed -i 's/^requirements =.*/requirements = python3==3.11.9,kivy,hostpython3==3.11.9/' buildozer.spec || true

    - name: Build APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
        CFLAGS: "-Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration"
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
