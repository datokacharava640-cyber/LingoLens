name: Build LingoLens APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies for NumPy & Kivy
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libffi-dev \
          libssl-dev \
          autoconf \
          libtool \
          pkg-config \
          zip \
          unzip \
          gfortran \
          libopenblas-dev \
          ccache

    - name: Install Buildozer, Cython & p4a
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # Cython 3.x არათავსებადია ძველ p4a numpy recipe-ებთან, ამიტომ ვაყენებთ 0.29.33-ს
        python -m pip install "cython==0.29.33"
        python -m pip install buildozer
        python -m pip install git+https://github.com/kivy/python-for-android.git@master

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-APK
        path: bin/*.apk
