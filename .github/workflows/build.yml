name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev unzip sqlite3 \
            libsqlite3-dev libffi-dev libssl-dev autoconf libtool pkg-config \
            zip ccache libunwind-dev gettext lld cmake ninja-build

      - name: Install Python & Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" "buildozer==1.5.0"

      - name: Build APK with Buildozer (With Retry)
        run: |
          buildozer -v android debug || buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-APK
          path: bin/*.apk
