name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies & Block Cython 3 Global
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libtool pkg-config python3-dev libsqlite3-dev zlib1g-dev unzip zip autoconf automake cmake lld clang libncurses5-dev libncursesw5-dev

        # სისტემურ დონეზე ვბლოკავთ Cython 3-ს ყველა ვირტუალური გარემოსთვის
        echo "cython==0.29.36" | sudo tee /tmp/constraints.txt
        sudo mkdir -p /etc/pip
        printf "[global]\nconstraint = /tmp/constraints.txt\n" | sudo tee /etc/pip.conf

        python -m pip install --upgrade pip setuptools wheel
        pip install "cython==0.29.36" "buildozer==1.5.0" "python-for-android==2024.1.21"

    - name: Clean build cache
      run: |
        rm -rf ~/.buildozer .buildozer bin/

    - name: Build APK with Buildozer
      run: |
        export CFLAGS="-Wno-implicit-function-declaration -Wno-error=implicit-function-declaration -Wno-incompatible-pointer-types -Wno-error=incompatible-pointer-types -Wno-error=deprecated-declarations"
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
