name: Build and Release LingoLens APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache Buildozer global directory
      uses: actions/cache@v3
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}

    - name: Cache Buildozer build directory
      uses: actions/cache@v3
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-local-${{ hashFiles('buildozer.spec') }}

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ccache zip unzip openjdk-17-jdk git python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake

    - name: Install Python Dependencies
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer kivy
        pip install --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Build APK with Buildozer
      run: |
        yes | buildozer android debug

    - name: Get Latest Tag or Create One
      id: tag
      run: |
        TAG_NAME="v1.0.${{ github.run_number }}"
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        tag_name: ${{ env.TAG_NAME }}
        name: "LingoLens Release ${{ env.TAG_NAME }}"
        body: "Auto-generated APK build."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
