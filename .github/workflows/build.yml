name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            libssl-dev \
            libffi-dev \
            libgdbm-dev \
            libreadline-dev \
            libncursesw5-dev \
            tk-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            uuid-dev \
            zip \
            unzip \
            lld \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<70.0.0" "cython==0.29.33" "buildozer==1.5.0"

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-debug-apk
          path: bin/*.apk
