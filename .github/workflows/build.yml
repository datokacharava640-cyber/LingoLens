name: Build Android APK (Buildozer)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libffi-dev libssl-dev

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Fix magic commands in Python files
      run: |
        python3 -c "
        import glob
        for filepath in glob.glob('**/*.py', recursive=True):
            with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                lines = f.readlines()
            cleaned = [line for line in lines if not line.strip().startswith('%cd')]
            with open(filepath, 'w', encoding='utf-8') as f:
                f.writelines(cleaned)
        "

    - name: Build Android APK with Buildozer
      run: |
        cd mobile_app
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-UltraPro-Debug-APK
        path: mobile_app/bin/*.apk
