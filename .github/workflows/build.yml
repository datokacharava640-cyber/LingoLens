name: Build LingoLens APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer Global Directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install System Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config lld
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "cython<3.0.0"
        python -m pip install --upgrade buildozer

    - name: Pre-clone python-for-android
      run: |
        mkdir -p ~/.buildozer/android/platform
        if [ ! -d "$HOME/.buildozer/android/platform/python-for-android" ]; then
          git clone --depth 1 https://github.com/kivy/python-for-android.git ~/.buildozer/android/platform/python-for-android
        fi

    - name: Build Android Debug APK
      env:
        ANDROID_NDK_HOME: ''
        ANDROID_NDK_ROOT: ''
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-UltraPro-Debug-APK
        path: bin/*.apk
        if-no-files-found: error
