name: Build Android Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg pkg-config autoconf automake libtool ccache \
          libffi-dev libssl-dev zip unzip openjdk-17-jdk libsdl2-dev \
          libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev \
          libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev \
          sqlite3 libbz2-dev gettext curl

    - name: Force Python 3.10 Priority
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "cython<3.0.0" buildozer
        echo "$pythonLocation/bin" >> $GITHUB_PATH
        echo "PYTHON=$pythonLocation/bin/python3" >> $GITHUB_ENV

    - name: Clean Buildozer Cache
      run: |
        rm -rf .buildozer

    - name: Build APK
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
        PATH: ${{ env.pythonLocation }}/bin:${{ env.PATH }}
        CFLAGS: "-fcommon -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
        CXXFLAGS: "-fcommon -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion"
      run: |
        python3 -m buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
