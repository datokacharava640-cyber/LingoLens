name: Build LingoLens APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config lld
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "cython==0.29.33"
        python -m pip install buildozer

    - name: Clone python-for-android
      run: |
        mkdir -p ~/.buildozer/android/platform
        rm -rf ~/.buildozer/android/platform/python-for-android
        git clone --depth 1 https://github.com/kivy/python-for-android.git ~/.buildozer/android/platform/python-for-android

    - name: Build Android Debug APK
      env:
        ANDROID_NDK_HOME: ''
        ANDROID_NDK_ROOT: ''
        P4A_DIR: '/home/runner/.buildozer/android/platform/python-for-android'
        USE_CYTHON3: '0'
      run: |
        # ეძებს buildozer.spec ფაილს პროექტში და გადადის იმ საქაღალდეში
        SPEC_DIR=$(find . -maxdepth 2 -name "buildozer.spec" -exec dirname {} \;)
        if [ -n "$SPEC_DIR" ]; then
          cd "$SPEC_DIR"
        fi
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-UltraPro-Debug-APK
        path: |
          bin/*.apk
          **/bin/*.apk
        if-no-files-found: error
