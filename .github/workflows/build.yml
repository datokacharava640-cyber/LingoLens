name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & Python 3.10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3.10 python3.10-dev python3.10-venv python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev \
            libssl-dev libffi-dev liblzma-dev

      - name: Create Isolated Python 3.10 Environment
        run: |
          python3.10 -m venv venv
          source venv/bin/activate
          python --version
          pip install --upgrade pip
          pip install "Cython==0.29.21" "buildozer==1.4.0"

      - name: Clean Old Buildozer Cache
        run: |
          rm -rf .buildozer/android/platform/build-*

      - name: Build APK with Buildozer
        env:
          CFLAGS: "-w"
          CXXFLAGS: "-w"
        run: |
          source venv/bin/activate
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoLens-APK
          path: bin/*.apk
