name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git ffmpeg libsqlite3-dev zlib1g-dev openjdk-17-jdk zip unzip autoconf libtool cmake lld perl pkg-config

    - name: Install Pinned Buildozer, P4A & Cython
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install "cython==0.29.36" "buildozer==1.5.0" "python-for-android==2024.1.21"

    - name: Clean & Build APK
      env:
        P4A_CYTHON_VERSION: "0.29.36"
      run: |
        rm -rf .buildozer
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-debug-apk
        path: bin/*.apk
      if: success()
