name: Build LingoLens Ultra Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk unzip zip ccache
        pip install --upgrade pip setuptools buildozer cython

    - name: Build APK with Buildozer
      run: |
        # ქსელური კავშირის შეცდომების თავიდან ასაცილებლად
        export PIP_RETRIES=10
        export PIP_TIMEOUT=60
        buildozer -v android debug
