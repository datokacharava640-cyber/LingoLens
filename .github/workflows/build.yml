name: Build LingoLens APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev libsqlite3-dev libxml2-dev libxmlsec1-dev zlib1g-dev ccache git unzip zip openjdk-17-jdk autoconf libtool pkg-config
        python -m pip install --upgrade pip setuptools buildozer kivy Cython==0.29.33

    - name: Build APK with Buildozer
      run: |
        buildozer android release
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUMS: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: LingoLens-Ultra-Pro-APK
        path: bin/*.apk
