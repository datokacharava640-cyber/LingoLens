name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Global Cython Constraint & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libtool pkg-config python3-dev libsqlite3-dev zlib1g-dev unzip zip autoconf automake cmake lld clang libncurses5-dev libncursesw5-dev
        
        # ვქმნით გლობალურ შეზღუდვის ფაილს
        echo "cython<3.0.0" > /tmp/constraints.txt
        echo "cython==0.29.36" >> /tmp/constraints.txt
        
        # გადავცემთ შეზღუდვას GitHub Actions-ის ყველა შემდგომ ნაბიჯს
        echo "PIP_CONSTRAINT=/tmp/constraints.txt" >> $GITHUB_ENV
        
        python -m pip install --upgrade pip setuptools wheel
        pip install "cython==0.29.36" "buildozer==1.5.0"

    - name: Clean build cache
      run: |
        rm -rf ~/.buildozer .buildozer bin/

    - name: Build APK with Buildozer
      env:
        CFLAGS: "-Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-deprecated-declarations"
        CXXFLAGS: "-Wno-implicit-function-declaration -Wno-incompatible-pointer-types"
        APP_CFLAGS: "-Wno-implicit-function-declaration"
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
