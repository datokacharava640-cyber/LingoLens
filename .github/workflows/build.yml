name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev ccache git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk unzip zip
          pip install --upgrade pip setuptools buildozer Cython==0.29.33

      - name: Build APK with Buildozer
        run: |
          rm -rf .buildozer bin .plat-android
          buildozer android debug
        env:
          P4A_RELEASE_KEYSTORE_PASSPHRASE: ""

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: LingoLens-APK
          path: bin/*.apk
