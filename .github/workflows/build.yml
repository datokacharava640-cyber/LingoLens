name: Build and Release LingoLens APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev libssl-dev ccache zip unzip openjdk-17-jdk git python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip setuptools buildozer cython kivy

    - name: Build APK with Buildozer
      run: |
        buildozer android release

    - name: Get Latest Tag or Create One
      id: tag
      run: |
        TAG_NAME="v1.0.${{ github.run_number }}"
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        tag_name: ${{ env.TAG_NAME }}
        name: "LingoLens Release ${{ env.TAG_NAME }}"
        body: "Auto-generated APK build with updated Gemini AI integration and auto-update support."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
