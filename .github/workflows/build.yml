name: Build LingoLens APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libffi-dev libxml2-dev libxmlsec1-dev zlib1g-dev ccache git unzip zip openjdk-17-jdk autoconf libtool pkg-config
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install "Cython==0.29.33" "buildozer==1.5.0"

    - name: Build APK with Buildozer
      run: |
        buildozer android debug
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUMS: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Ultra-Pro-APK
        path: bin/*.apk
