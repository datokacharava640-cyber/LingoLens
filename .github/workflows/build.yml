name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libtool pkg-config python3-dev libsqlite3-dev zlib1g-dev unzip zip autoconf automake cmake lld clang libncurses5-dev libncursesw5-dev
        
        # ვქმნით შეზღუდვის ფაილს Workspace-ში
        echo "cython==0.29.36" > ${{ github.workspace }}/constraints.txt
        
        python -m pip install --upgrade pip setuptools wheel
        pip install "cython==0.29.36" "buildozer==1.5.0"

    - name: Clean build cache
      run: |
        rm -rf ~/.buildozer .buildozer bin/

    - name: Build APK with Buildozer
      env:
        PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        CFLAGS: "-w -Wno-implicit-function-declaration -Wno-incompatible-pointer-types"
        CXXFLAGS: "-w"
        LDFLAGS: "-w"
        APP_CFLAGS: "-w"
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LingoLens-Debug-APK
        path: bin/*.apk
